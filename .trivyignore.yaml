# Triaje explícito del escaneo de imagen (#260).
#
# La compuerta de CI bloquea la publicación ante HIGH/CRITICAL con parche
# disponible. Este fichero es la ÚNICA forma de dejar pasar una de esas, y a
# propósito es incómoda: cada entrada necesita una razón escrita y una fecha de
# caducidad. Cuando la fecha pasa, el hallazgo vuelve a bloquear y hay que
# volver a mirarlo — no existe el permiso permanente.
#
# Qué hacer cuando una entrada caduca y el pipeline se para:
#   1. Reescanear en local:
#      docker save -o /tmp/img.tar ghcr.io/noxvytop/cefiro-webmail:sha-<commit>
#      docker run --rm -v /tmp:/scan aquasec/trivy image --input /scan/img.tar \
#        --severity HIGH,CRITICAL --ignore-unfixed
#   2. Si ya está parcheado aguas arriba: refrescar el digest de la base en el
#      Dockerfile (el comando está escrito ahí) y borrar la entrada de aquí.
#   3. Si sigue sin parche aplicable: volver a evaluar el riesgo REAL en este
#      contexto y, solo entonces, extender la fecha dejando dicho por qué.
#
# Ver docs/OPERATIONS.md → "Qué garantiza la imagen publicada".

vulnerabilities:
  # Paquetes del sistema que vienen en la imagen base (debian 13 dentro de
  # oven/bun:1.3-slim). No se arreglan desde aquí: la vía correcta es que
  # upstream reconstruya la base, y entonces se refresca el digest. Un
  # `apt-get upgrade` en el Dockerfile los taparía hoy y rompería justo lo que
  # este issue vino a arreglar — que el mismo commit reconstruya la misma
  # imagen —, así que no se hace.
  - id: CVE-2026-4878
    statement: >-
      libcap2: escalada por TOCTOU en cap_set_file(). El contenedor corre como
      usuario `bun` sin capacidades y nada en la imagen llama a cap_set_file:
      no hay ruta de explotación desde el servicio. Pendiente de que la base
      de oven/bun recoja 1:2.75-10+deb13u1.
    expired_at: 2026-11-01
  - id: CVE-2026-45447
    statement: >-
      openssl (libssl3t64 / openssl-provider-legacy): use-after-free en
      PKCS7_verify(). El servidor no verifica PKCS#7 ni S/MIME por ninguna
      ruta, y el TLS de entrada lo termina el proxy del despliegue, no este
      contenedor. Pendiente de que la base recoja 3.5.6-1~deb13u2.
    expired_at: 2026-11-01

  # Dependencia del frontend. Viaja en node_modules porque `bun install
  # --production` instala las dependencias de producción de TODO el workspace,
  # pero el servidor no la importa jamás: el navegador recibe el bundle ya
  # construido de apps/web/dist. Subir a 8.x es un salto mayor en apps/web, con
  # su propio issue; no entra por la puerta de atrás de un cambio de CI.
  - id: GHSA-qwww-vcr4-c8h2
    statement: >-
      react-router 7.18.1: bypass de CSRF en modo RSC. Esta aplicación es una
      SPA construida con Vite, sin RSC ni servidor de react-router, y la copia
      en node_modules no se ejecuta en ningún momento. La corrección (8.3.0) es
      un cambio de versión mayor del frontend y se aborda en su propio issue.
    expired_at: 2026-11-01
