# Triaje explícito del escaneo de imagen (#260).
#
# La compuerta de CI bloquea la publicación ante HIGH/CRITICAL con parche
# disponible. Este fichero es la ÚNICA forma de dejar pasar una de esas, y a
# propósito es incómoda: cada entrada necesita una razón escrita y una fecha de
# caducidad. Cuando la fecha pasa, el hallazgo vuelve a bloquear y hay que
# volver a mirarlo — no existe el permiso permanente.
#
# Qué hacer cuando una entrada caduca y el pipeline se para:
#   1. Reescanear en local:
#      docker save -o /tmp/img.tar ghcr.io/noxvytop/cefiro-webmail:sha-<commit>
#      docker run --rm -v /tmp:/scan aquasec/trivy image --input /scan/img.tar \
#        --severity HIGH,CRITICAL --ignore-unfixed
#   2. Si ya está parcheado aguas arriba: refrescar el digest de la base en el
#      Dockerfile (el comando está escrito ahí) y borrar la entrada de aquí.
#   3. Si sigue sin parche aplicable: volver a evaluar el riesgo REAL en este
#      contexto y, solo entonces, extender la fecha dejando dicho por qué.
#
# Ver docs/OPERATIONS.md → "Qué garantiza la imagen publicada".

vulnerabilities:
  # Paquetes del sistema que vienen en la imagen base (debian 13 dentro de
  # oven/bun:1.3-slim). No se arreglan desde aquí: la vía correcta es que
  # upstream reconstruya la base, y entonces se refresca el digest. Un
  # `apt-get upgrade` en el Dockerfile los taparía hoy y rompería justo lo que
  # este issue vino a arreglar — que el mismo commit reconstruya la misma
  # imagen —, así que no se hace.
  - id: CVE-2026-4878
    statement: >-
      libcap2: escalada por TOCTOU en cap_set_file(). El contenedor corre como
      usuario `bun` sin capacidades y nada en la imagen llama a cap_set_file:
      no hay ruta de explotación desde el servicio. Pendiente de que la base
      de oven/bun recoja 1:2.75-10+deb13u1.
    expired_at: 2026-11-01
  - id: CVE-2026-45447
    statement: >-
      openssl (libssl3t64 / openssl-provider-legacy): use-after-free en
      PKCS7_verify(). El servidor no verifica PKCS#7 ni S/MIME por ninguna
      ruta, y el TLS de entrada lo termina el proxy del despliegue, no este
      contenedor. Pendiente de que la base recoja 3.5.6-1~deb13u2.
    expired_at: 2026-11-01
  # Triaje del 27-08-2026: la compuerta paró la publicación de `latest` y
  # `staging` con 38 hallazgos HIGH que son 5 CVE repetidos en los 8 binarios
  # de util-linux (bsdutils, login, mount, util-linux, libblkid1, libmount1,
  # libsmartcols1, libuuid1) más uno de openssl. El digest upstream de
  # oven/bun:1.3-slim seguía siendo el que pineamos, así que no había base
  # parcheada que refrescar. Debian ya publica el arreglo (util-linux
  # 2.41.5-0+deb13u1, openssl 3.5.7-1~deb13u2): en cuanto oven/bun reconstruya
  # la base, refrescar el digest y borrar estas cinco entradas.
  - id: CVE-2026-53612
    statement: >-
      util-linux: TOCTOU en mount(8) al aplicar propietario/modo tras montar.
      El contenedor corre como `bun` sin capacidades, no monta nada y ningún
      código de la imagen invoca mount(8). Pendiente de que la base recoja
      2.41.5-0+deb13u1.
    expired_at: 2026-11-01
  - id: CVE-2026-53613
    statement: >-
      util-linux: TOCTOU en mount(8) por intercambio de un directorio
      ancestro. Misma situación: sin montajes ni llamadas a mount(8) desde el
      servicio. Pendiente de 2.41.5-0+deb13u1.
    expired_at: 2026-11-01
  - id: CVE-2026-53614
    statement: >-
      util-linux: mount(8) SUID permite saltarse nosuid/noexec vía
      LIBMOUNT_FORCE_MOUNT2. Requiere ejecutar mount(8) con SUID desde dentro
      del contenedor; el proceso corre como `bun`, sin capacidades, y no hay
      ruta que lo invoque. Pendiente de 2.41.5-0+deb13u1.
    expired_at: 2026-11-01
  - id: CVE-2026-53615
    statement: >-
      util-linux (libblkid): desbordamiento de entero al analizar tablas de
      particiones DOS. libblkid solo se ejercita al inspeccionar dispositivos
      de bloque; el contenedor no accede a ninguno. Pendiente de
      2.41.5-0+deb13u1.
    expired_at: 2026-11-01
  - id: CVE-2026-14456
    statement: >-
      openssl (openssl-provider-legacy): denegación de servicio por memoria
      sin límite en el servidor QUIC. Este contenedor no sirve QUIC ni termina
      TLS (lo hace el proxy del despliegue); Bun trae su propio TLS y el
      paquete de Debian no está en la ruta de red del servicio. Pendiente de
      3.5.7-1~deb13u2.
    expired_at: 2026-11-01
