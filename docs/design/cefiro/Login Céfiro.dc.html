<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    * { box-sizing: border-box; }
    ::placeholder { color: inherit; opacity: 0.4; }
    a { color: #6FE3C1; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes logoSpin { to { transform: rotate(360deg); } }
    @keyframes windFlow { to { stroke-dashoffset: -96; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes pulse { 0% { opacity: 0.35; } 50% { opacity: 1; } 100% { opacity: 0.35; } }
  </style>
</helmet>

<div data-screen-label="Login Céfiro" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; font-family:'Space Grotesk', system-ui, sans-serif; background:var(--bg, #0A0B10); color:var(--ink, #ECEEF4); {{ themeVars }}">

  <div style="width:400px; max-width:100%; display:flex; flex-direction:column; align-items:center; animation:fadeUp 0.35s ease;">

    <!-- Logo animado -->
    <svg width="72" height="72" viewBox="0 0 40 40" fill="none" style="margin-bottom:20px;">
      <g style="transform-origin:center; transform-box:fill-box; animation:logoSpin 28s linear infinite;">
        <circle cx="20" cy="20" r="18" stroke="var(--accent, #6FE3C1)" stroke-width="1.3" stroke-dasharray="3.5 6.5" opacity="0.45"></circle>
      </g>
      <path d="M9 15h13a3.6 3.6 0 1 0-3.6-6.3" stroke="var(--accent, #6FE3C1)" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="12 36" style="animation:windFlow 3.4s linear infinite;"></path>
      <path d="M7 21h19a3.6 3.6 0 1 1 3.6 6.3" stroke="var(--accent, #6FE3C1)" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="12 36" style="animation:windFlow 3.4s linear infinite; animation-delay:-1.1s;"></path>
      <path d="M9 27h10" stroke="var(--accent, #6FE3C1)" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="10 38" style="animation:windFlow 3.4s linear infinite; animation-delay:-2.2s;"></path>
      <circle cx="33" cy="8" r="1.6" fill="var(--accent, #6FE3C1)" style="transform-origin:center; transform-box:fill-box; animation:twinkle 2.4s ease-in-out infinite;"></circle>
    </svg>

    <div style="font-size:19px; font-weight:700; letter-spacing:0.32em; margin-bottom:6px;">CÉFIRO</div>
    <div style="font-size:13.5px; color:var(--muted, #8B90A2); margin-bottom:32px;">Inicia sesión en el correo de tu equipo</div>

    <div style="width:100%; background:var(--panel, #12141C); border:1px solid var(--line, #232838); border-radius:16px; padding:28px 28px 26px; box-shadow:0 18px 50px rgba(0,0,0,0.35);">

      <!-- SSO -->
      <button onClick="{{ onSso }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:10px; height:46px; border:none; border-radius:11px; background:var(--accent, #6FE3C1); color:var(--accent-ink, #07130F); font:inherit; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 2px 14px rgba(111,227,193,0.25);" style-hover="filter:brightness(1.07);" style-active="transform:scale(0.98);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg>
        {{ ssoLabel }}
      </button>
      <sc-if value="{{ ssoLoading }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; font-size:12.5px; color:var(--accent, #6FE3C1); animation:pulse 1.2s ease infinite;">Redirigiendo a tu proveedor de identidad…</div>
      </sc-if>

      <!-- Credenciales (recuperación / bootstrap) -->
      <sc-if value="{{ credsEnabled }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; align-items:center; gap:12px; margin:22px 0 18px;">
          <span style="flex:1; height:1px; background:var(--line, #232838);"></span>
          <span style="font-size:11.5px; color:var(--muted, #8B90A2); letter-spacing:0.05em;">o con credenciales</span>
          <span style="flex:1; height:1px; background:var(--line, #232838);"></span>
        </div>

        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-size:12.5px; font-weight:600; color:var(--muted, #8B90A2);">Correo</label>
            <input value="{{ email }}" onChange="{{ onEmail }}" placeholder="tu@cefiro.top" type="email" style="width:100%; height:44px; padding:0 14px; border:1px solid var(--line, #232838); border-radius:10px; background:var(--soft, #171A24); font:inherit; font-size:14px; color:inherit; outline:none;" style-focus="border-color:var(--accent, #6FE3C1);">
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-size:12.5px; font-weight:600; color:var(--muted, #8B90A2);">Contraseña</label>
            <input value="{{ password }}" onChange="{{ onPassword }}" placeholder="••••••••" type="password" style="width:100%; height:44px; padding:0 14px; border:1px solid var(--line, #232838); border-radius:10px; background:var(--soft, #171A24); font:inherit; font-size:14px; color:inherit; outline:none;" style-focus="border-color:var(--accent, #6FE3C1);">
          </div>
          <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:12.5px; color:#F26565; animation:fadeUp 0.2s ease;">{{ errorMsg }}</div>
          </sc-if>
          <button onClick="{{ onLogin }}" style="width:100%; height:44px; margin-top:2px; border:1px solid var(--line, #232838); border-radius:11px; background:transparent; color:var(--ink, #ECEEF4); font:inherit; font-size:14px; font-weight:600; cursor:pointer;" style-hover="background:var(--hover, #191D28); border-color:var(--accent, #6FE3C1);" style-active="transform:scale(0.98);">{{ loginLabel }}</button>
        </div>
      </sc-if>

      <sc-if value="{{ credsDisabled }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:18px; padding:12px 14px; border-radius:10px; background:var(--soft, #171A24); border:1px solid var(--line, #232838); font-size:12px; line-height:1.55; color:var(--muted, #8B90A2); text-align:center;">
          El acceso con credenciales está deshabilitado.<br>Disponible solo en modo recuperación.
        </div>
      </sc-if>
    </div>

    <div style="display:flex; align-items:center; gap:8px; margin-top:22px; font-size:11.5px; color:var(--muted, #8B90A2);">
      <span style="font-weight:700; letter-spacing:0.14em; color:var(--accent, #6FE3C1);">CÉFIRO</span> · el viento que mueve tu equipo
    </div>
  </div>

  <!-- Toast -->
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--ink, #ECEEF4); color:var(--bg, #0A0B10); font-size:13.5px; font-weight:500; padding:11px 20px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,0.35); z-index:70; animation:fadeUp 0.22s ease;">{{ toastMsg }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;credenciales&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Acceso&quot; },
  &quot;theme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Noche&quot;, &quot;Claro&quot;], &quot;default&quot;: &quot;Noche&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Tema&quot; }
}">
class Component extends DCLogic {
  state = { email: '', password: '', error: null, toast: null, ssoLoading: false, loggingIn: false };

  themeVars() {
    const t = this.props.theme ?? 'Noche';
    if (t === 'Claro') return '--bg:#F1F4F4;--panel:#FFFFFF;--ink:#101318;--muted:#66707E;--line:#E2E7E9;--accent:#0FA383;--accent-ink:#FFFFFF;--soft:#EDF7F3;--hover:#F3F7F6;--sel:#DCF2EA;';
    return '--bg:#0A0B10;--panel:#12141C;--ink:#ECEEF4;--muted:#8B90A2;--line:#232838;--accent:#6FE3C1;--accent-ink:#07130F;--soft:#171A24;--hover:#191D28;--sel:#15302B;';
  }

  showToast(msg) {
    clearTimeout(this._toastT);
    this.setState({ toast: msg });
    this._toastT = setTimeout(() => this.setState({ toast: null }), 2600);
  }

  componentWillUnmount() {
    clearTimeout(this._toastT);
    clearTimeout(this._ssoT);
    clearTimeout(this._loginT);
  }

  renderVals() {
    const s = this.state;
    const creds = this.props.credenciales ?? true;
    return {
      themeVars: this.themeVars(),
      credsEnabled: !!creds,
      credsDisabled: !creds,
      email: s.email,
      password: s.password,
      onEmail: (e) => this.setState({ email: e.target.value, error: null }),
      onPassword: (e) => this.setState({ password: e.target.value, error: null }),
      hasError: !!s.error,
      errorMsg: s.error || '',
      loginLabel: s.loggingIn ? 'Iniciando sesión…' : 'Iniciar sesión',
      onLogin: () => {
        if (!s.email.trim() || !s.email.includes('@')) { this.setState({ error: 'Introduce un correo válido.' }); return; }
        if (!s.password) { this.setState({ error: 'Introduce tu contraseña.' }); return; }
        this.setState({ loggingIn: true, error: null });
        this._loginT = setTimeout(() => {
          this.setState({ loggingIn: false });
          this.showToast('Sesión iniciada — abriendo tu bandeja…');
        }, 1000);
      },
      ssoLabel: s.ssoLoading ? 'Conectando…' : 'Iniciar sesión con SSO',
      ssoLoading: s.ssoLoading,
      onSso: () => {
        this.setState({ ssoLoading: true });
        this._ssoT = setTimeout(() => {
          this.setState({ ssoLoading: false });
          this.showToast('SSO verificado — abriendo tu bandeja…');
        }, 1400);
      },
      hasToast: !!s.toast,
      toastMsg: s.toast || ''
    };
  }
}
</script>
</body>
</html>
