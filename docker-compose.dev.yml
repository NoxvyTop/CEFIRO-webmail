services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webmail
      POSTGRES_PASSWORD: webmail
      POSTGRES_DB: webmail
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmail"]
      interval: 5s
      timeout: 5s
      retries: 10

  dev:
    image: oven/bun:1.3
    working_dir: /app
    command: sh scripts/dev-container.sh
    environment:
      DATABASE_URL: postgres://webmail:webmail@postgres:5432/webmail
      PORT: "8080"
      CHOKIDAR_USEPOLLING: "1"
      APP_URL: http://localhost:5173
      MASTER_KEY: ZGV2LW1hc3Rlci1rZXktZGV2LW1hc3Rlci1rZXktMDE=
      BOOTSTRAP_MODE: "true"
      # Explicitly unconfigured in local dev; developers with a reachable
      # Stalwart instance can point this at it.
      STALWART_URL: ""
    ports:
      - "5173:5173"
      - "8090:8080"
    volumes:
      - .:/app
      - dev_root_modules:/app/node_modules
      - dev_server_modules:/app/apps/server/node_modules
      - dev_web_modules:/app/apps/web/node_modules
      - dev_shared_modules:/app/packages/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  dev_root_modules:
  dev_server_modules:
  dev_web_modules:
  dev_shared_modules:
