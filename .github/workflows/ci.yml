name: ci

on:
  push:
    branches: ["init-**", preproduc, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webmail
          POSTGRES_PASSWORD: webmail
          POSTGRES_DB: webmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
        env:
          DATABASE_URL: postgres://webmail:webmail@localhost:5432/webmail

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webmail
          POSTGRES_PASSWORD: webmail
          POSTGRES_DB: webmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: cd e2e && bunx playwright install --with-deps chromium
      # Brings up the pre-provisioned Stalwart fixture (docker-compose.e2e.yml)
      # so tests/mail-connect.spec.ts has a real JMAP/SMTP backend to talk to.
      # Postgres stays the `services:` container above, not part of this
      # compose file (see docker-compose.e2e.yml's own comment on that).
      - run: docker compose -f docker-compose.e2e.yml up -d --build
      - name: Wait for Stalwart to be healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f docker-compose.e2e.yml ps -q stalwart)" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "Stalwart did not become healthy in time" >&2
          docker compose -f docker-compose.e2e.yml logs
          exit 1
      - run: cd e2e && bunx playwright test
        env:
          DATABASE_URL: postgres://webmail:webmail@localhost:5432/webmail
          E2E_STALWART_URL: http://localhost:8096
          CI: "true"
      - if: always()
        run: docker compose -f docker-compose.e2e.yml down
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  publish:
    if: github.event_name == 'push' && (github.ref_name == 'preproduc' || github.ref_name == 'main')
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/noxvytop/webmail:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
