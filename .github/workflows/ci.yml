name: ci

on:
  push:
    branches: ["init-**", preproduc, main]
  pull_request:

# Successive pushes to the same PR supersede each other: only the newest
# commit's result is ever looked at, so letting the older runs finish burns
# Actions minutes to produce an answer nobody reads. Pushes to preproduc and
# main are deliberately NOT cancelled — those runs gate the publish job, and
# cancelling one halfway could leave the registry without the image its
# commit was supposed to produce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: [self-hosted, linux, x64, docker]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webmail
          POSTGRES_PASSWORD: webmail
          POSTGRES_DB: webmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      # Bun's global package cache. Keyed on the lockfile, so it is reused
      # until a dependency actually changes rather than re-downloading the
      # whole tree on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
        env:
          DATABASE_URL: postgres://webmail:webmail@localhost:5432/webmail

  e2e:
    runs-on: [self-hosted, linux, x64, docker]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webmail
          POSTGRES_PASSWORD: webmail
          POSTGRES_DB: webmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Chromium is a ~150 MB download that only changes when the pinned
      # Playwright version does, so it is cached on the lockfile.
      #
      # `--with-deps` is deliberately absent: it shells out to apt-get, and
      # the account these jobs run as has no sudo — on purpose, since it
      # executes workflow code and should not also hold root. The apt
      # libraries Chromium links against are installed once on the runner
      # host instead. On a cache hit this step is a no-op.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: cd e2e && bunx playwright install chromium
      # Brings up the pre-provisioned Stalwart fixture (docker-compose.e2e.yml)
      # so tests/mail-connect.spec.ts has a real JMAP/SMTP backend to talk to.
      # Postgres stays the `services:` container above, not part of this
      # compose file (see docker-compose.e2e.yml's own comment on that).
      - run: docker compose -f docker-compose.e2e.yml up -d --build
      - name: Wait for Stalwart to be healthy
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f docker-compose.e2e.yml ps -q stalwart)" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "Stalwart did not become healthy in time" >&2
          docker compose -f docker-compose.e2e.yml logs
          exit 1
      - run: cd e2e && bunx playwright test
        env:
          DATABASE_URL: postgres://webmail:webmail@localhost:5432/webmail
          E2E_STALWART_URL: http://localhost:8096
          CI: "true"
      - if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  publish:
    if: github.event_name == 'push' && (github.ref_name == 'preproduc' || github.ref_name == 'main')
    needs: [test, e2e]
    runs-on: [self-hosted, linux, x64, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image build is the most expensive single step in the pipeline and
      # a runner starts with an empty Docker layer cache, so without this it
      # rebuilds every layer — dependency install included — on every release.
      # mode=max caches intermediate stages too, which is what makes the
      # multi-stage build actually reuse its install layer.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/noxvytop/cefiro-webmail:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
