name: ci

on:
  push:
    branches: ["init-**", preproduc, main]
    # Release tags (vX.Y.Z) publish an immutable, semver-pinned image so a
    # deploy can pin to and roll back to an exact version (GH #190).
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  # Lets a branch be validated on demand without either opening a placeholder
  # pull request or widening the automatic push triggers — broadening those
  # would commit every future branch matching the pattern to consuming a
  # runner forever, to solve a problem that only exists while iterating.
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

# Successive pushes to the same PR supersede each other: only the newest
# commit's result is ever looked at, so letting the older runs finish burns
# Actions minutes to produce an answer nobody reads. Pushes to preproduc and
# main are deliberately NOT cancelled — those runs gate the publish job, and
# cancelling one halfway could leave the registry without the image its
# commit was supposed to produce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Where each job runs is deliberate, not incidental.
#
# The self-hosted runner is OUR machine: our kernel, our packages, our Docker.
# It is excellent for the inner loop — fast, and it costs no Actions minutes —
# but validating a release against an environment we tuned ourselves is the
# organisational version of "works on my machine". This pipeline already lost
# three waves of work to exactly that failure mode: a dependency GitHub's
# image supplied implicitly went unnoticed until the jobs moved off it.
#
# So anything gating `main` runs on GitHub's stock image instead — neutral
# infrastructure, independent of anything we installed. `main` is reached
# rarely, so the quota comfortably covers it: minutes get spent precisely
# where they buy a guarantee.
#
# Containerising the jobs is what makes this safe to alternate: the toolchain
# is declared in this file, so the same job behaves identically on either.
jobs:
  # Resolves the Stalwart fixture image the e2e job will run against, and
  # publishes it if that exact image does not exist yet.
  #
  # The tag is derived from the CONTENT of e2e/stalwart, not written by hand.
  # A hand-written tag was the previous design, and it did not freeze anything:
  # the publishing workflow pushed a fixed `v1` on every fixture change, so an
  # old commit silently started being tested against a fixture that did not
  # exist when it was written. The file even said "bump it whenever either
  # input changes" — an intention that depends on nobody forgetting is not a
  # guarantee, and there was nothing checking it.
  #
  # Content-addressing makes the guarantee structural instead. Change a seed
  # file and the tag changes with it, so the new fixture cannot occupy the old
  # one's name. Change nothing and the tag is already in the registry, the
  # build is skipped, and every commit keeps resolving to the bytes it was
  # written against.
  fixture:
    runs-on: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    env:
      IMAGE_NAME: ghcr.io/noxvytop/cefiro-e2e-stalwart
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        # hashFiles returns an empty string when the glob matches nothing, which
        # would silently produce the tag `sha-` and hand every future fixture the
        # same name again — the exact failure this job exists to remove. Fail
        # instead: an empty hash means the fixture directory moved, and that is
        # worth stopping for.
        run: |
          hash='${{ hashFiles('e2e/stalwart/**') }}'
          if [ -z "$hash" ]; then
            echo "::error::e2e/stalwart/** matched no files — the fixture directory moved or is empty."
            exit 1
          fi
          echo "image=${IMAGE_NAME}:sha-${hash}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: probe
        # The common case by far: the fixture has not changed, the image is
        # already published, and the whole job costs one registry round-trip.
        run: |
          if docker manifest inspect '${{ steps.resolve.outputs.image }}' >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.probe.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      - if: steps.probe.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./e2e/stalwart
          push: true
          tags: ${{ steps.resolve.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    # The job runs inside a declared image rather than on whatever the runner
    # host happens to have. That host is shared with other projects, so any
    # system-level dependency installed for one of them could change this
    # pipeline's behaviour without a single commit here. Pinning the image
    # makes the toolchain part of the repository.
    #
    # Node comes from the image because vitest's mock-hoisting transform needs
    # it (see the setup-node step's history); Bun is installed on top by its
    # own action, so both versions stay declared and independent.
    container: node:22-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webmail
          POSTGRES_PASSWORD: webmail
          POSTGRES_DB: webmail
        # No host port is published: a containerised job shares a network with
        # its services and reaches them by service name, so nothing binds on
        # the host and parallel jobs cannot collide over a port at all.
        options: >-
          --health-cmd "pg_isready -U webmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      # Bun's global package cache. Keyed on the lockfile, so it is reused
      # until a dependency actually changes rather than re-downloading the
      # whole tree on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
        env:
          # Reached by service name, not localhost: the job and its services
          # share a network, and no port is published on the host.
          DATABASE_URL: postgres://webmail:webmail@postgres:5432/webmail
      # A containerised job runs as root, so everything it writes into the
      # shared workspace ends up root-owned. On a self-hosted runner that
      # workspace persists between runs, and the next job that is NOT
      # containerised cannot even clean its own checkout — git fails with
      # EACCES on .git/objects, which reads like repository corruption and is
      # not. Hand ownership back to whoever the runner created the directory
      # as, rather than hardcoding a uid that only holds on this machine.
      - if: always()
        run: chown -R --reference="$RUNNER_WORKSPACE" "$GITHUB_WORKSPACE"

  e2e:
    # The fixture job resolves — and publishes if missing — the exact image
    # this job pulls, so the tag can never name bytes other than the ones this
    # commit declares.
    needs: [fixture]
    runs-on: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    # The official Playwright image, pinned to the exact @playwright/test
    # version the lockfile resolves. These two must match: Playwright refuses
    # to launch a browser from a mismatched image, and it was a caret range
    # here that produced the mismatch — the declared floor read 1.49.0 while
    # the lockfile had long since resolved 1.61.1. The dependency is now
    # pinned exactly so the pair cannot drift apart again silently.
    #
    # It ships Chromium and every system library the browser links against,
    # plus a matching Node.js, so the runner host needs nothing installed for
    # this job at all — see the `test` job's container comment for why jobs
    # are containerised in the first place: the host is shared with other
    # projects. Node itself is still required (not just Bun): Playwright's
    # test runner always executes global-setup.ts and the test workers under
    # a real `node` binary, even when the CLI itself is invoked via `bunx`
    # (see global-setup.ts's own comment on this) — the image's bundled Node
    # 22 covers that, so no separate actions/setup-node step is needed here.
    #
    # --ipc=host avoids Chromium crashing under Docker's default 64MB
    # /dev/shm, which is too small for a real browser to run reliably
    # (Playwright's own documented Docker/CI guidance).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webmail
          POSTGRES_PASSWORD: webmail
          POSTGRES_DB: webmail
        # No host port is published: a containerised job shares a network
        # with its services and reaches them by service name, exactly like
        # the `test` job.
        options: >-
          --health-cmd "pg_isready -U webmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      stalwart:
        # Pre-provisioned Stalwart fixture, built from ./e2e/stalwart (see that
        # directory's README for what's baked in). `services:` needs a
        # pre-built image rather than a build context, which is why this is not
        # `docker compose build` — the `fixture` job above covers the build.
        #
        # The tag is content-addressed rather than hand-written, so it names
        # this commit's fixture and cannot be repointed at a later one. See the
        # `fixture` job for why that distinction matters.
        image: ${{ needs.fixture.outputs.image }}
        # The package is private, like the repository it belongs to — a test
        # fixture with seeded mailboxes has no reason to be world-readable.
        # A service container pulls before any step runs, so it needs the
        # credential inline; the workflow's own token already has read access
        # to a package its repository published.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Stalwart's baked config advertises "https://mail.cefiro.test/…"
          # for the JMAP apiUrl/downloadUrl/uploadUrl/eventSourceUrl (set
          # during the original setup wizard run — see
          # e2e/stalwart/README.md). That host doesn't resolve here, so a
          # client following the advertised apiUrl verbatim (as
          # apps/server/src/infra/stalwart/jmap.ts does) cannot reach it.
          # STALWART_PUBLIC_URL overrides the advertised base URL
          # (crates/store/src/registry/local.rs); it must point at this
          # service's own name and container-native port — the only address
          # reachable from inside the job container's network — unlike
          # docker-compose.e2e.yml, which points it at the host-published
          # localhost:8096 because that setup has no shared service network.
          STALWART_PUBLIC_URL: "http://stalwart:8080"
        # The probe talks to the three ports the tests actually use, instead of
        # asking the binary its version. `stalwart --version` answers at t=0s,
        # before a single listener is serving, so the container was reported
        # healthy while it could still accept a TCP connection and drop it
        # without sending the SMTP greeting — which is precisely how seeding
        # failed: "SMTP connection closed before a final response arrived
        # (buffer: "")". Measured on the runner: version says ok at t=0s, the
        # ports answer at t≈2s. The suite passed most of the time because job
        # setup happened to outlast the gap, which is luck, not readiness.
        #
        # The `/cefiro.test` path is curl's EHLO domain, not a URL path. Without
        # it curl greets with the container hostname and Stalwart answers "550
        # Invalid EHLO domain" — a healthy server refusing a malformed hello,
        # which would make this probe fail forever against a working container.
        #
        # --insecure on 465 because the fixture's certificate is self-signed;
        # the seeder connects the same way (see e2e/smtp-seed.ts's
        # trust-on-first-use comment). This is a loopback probe inside the
        # container, so there is no transport to intercept.
        options: >-
          --health-cmd "curl -sS --max-time 3 -o /dev/null smtp://127.0.0.1:25/cefiro.test && curl -sS --max-time 3 -o /dev/null --insecure smtps://127.0.0.1:465/cefiro.test && curl -sS --max-time 3 -o /dev/null http://127.0.0.1:8080/"
          --health-interval 3s
          --health-timeout 10s
          --health-start-period 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # setup-bun extracts a zip, and the Playwright image is slim enough not
      # to ship unzip. This only surfaced on the second runner: the first had
      # Bun already in its tool cache and never had to extract anything, so
      # the job passed there for a reason that had nothing to do with being
      # correct. Install it explicitly rather than depending on which machine
      # happens to be warm.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Chromium and its system deps come from the container image now, not
      # from a lockfile-cached download + `playwright install`.
      - run: cd e2e && bunx playwright test
        env:
          # Reached by service name, not localhost — no port is published on
          # the host (mirrors the `test` job).
          DATABASE_URL: postgres://webmail:webmail@postgres:5432/webmail
          E2E_STALWART_URL: http://stalwart:8080
          STALWART_SMTP_HOST: stalwart
          STALWART_SMTP_PORT: "465"
          STALWART_SMTP_PLAIN_PORT: "25"
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      # A containerised job runs as root, so everything it writes into the
      # shared workspace ends up root-owned. On a self-hosted runner that
      # workspace persists between runs, and the next job that is NOT
      # containerised cannot even clean its own checkout — git fails with
      # EACCES on .git/objects, which reads like repository corruption and is
      # not. Hand ownership back to whoever the runner created the directory
      # as, rather than hardcoding a uid that only holds on this machine.
      - if: always()
        run: chown -R --reference="$RUNNER_WORKSPACE" "$GITHUB_WORKSPACE"


  publish:
    if: github.event_name == 'push' && (github.ref_name == 'preproduc' || github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, e2e]
    # A release tag is cut from main, so it validates and publishes on neutral
    # GitHub-hosted infra just like main does.
    runs-on: ${{ (github.ref_name == 'main' || github.base_ref == 'main' || startsWith(github.ref, 'refs/tags/v')) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every publish pushes a moving pointer AND an immutable per-commit tag,
      # so a deploy can pin to and roll back to an exact image (GH #190) instead
      # of chasing whatever :latest/:staging happens to point at now. A release
      # tag additionally publishes the semver tag it was cut as.
      #
      #   preproduc push -> :staging          + :sha-<commit>
      #   main push      -> :latest           + :sha-<commit>
      #   vX.Y.Z tag     -> :vX.Y.Z + :latest + :sha-<commit>
      - id: tags
        run: |
          img=ghcr.io/noxvytop/cefiro-webmail
          {
            echo "list<<EOF"
            echo "$img:sha-${GITHUB_SHA}"
            if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
              echo "$img:${GITHUB_REF_NAME}"
              echo "$img:latest"
            elif [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "$img:latest"
            else
              echo "$img:staging"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # The image build is the most expensive single step in the pipeline and
      # a runner starts with an empty Docker layer cache, so without this it
      # rebuilds every layer — dependency install included — on every release.
      # mode=max caches intermediate stages too, which is what makes the
      # multi-stage build actually reuse its install layer.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
