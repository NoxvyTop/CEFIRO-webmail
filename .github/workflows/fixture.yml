name: fixture

# Publishes the pre-provisioned Stalwart image that the e2e job consumes as a
# service container.
#
# A workflow `services:` entry can only reference an image that already
# exists — it cannot build from a context the way docker compose does. So the
# fixture has to live in a registry rather than being rebuilt inside every
# run, which also means it stops being rebuilt inside every run.
#
# It is published by CI using the token GitHub already injects, so no personal
# account scope has to be widened for what is a repository artefact.
#
# The tag is pinned deliberately: this is a frozen test fixture, not a moving
# dependency. It numbers the FIXTURE, not Stalwart — the seed data changes
# independently of the base image, so borrowing Stalwart's version here would
# quietly lie the first time only the seed changed. Bump it whenever either
# input changes, which keeps a fixture change a visible, reviewable commit.

on:
  push:
    branches: [preproduc, main]
    paths:
      - "e2e/stalwart/**"
      - ".github/workflows/fixture.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/noxvytop/cefiro-e2e-stalwart
  IMAGE_TAG: "v1"

jobs:
  publish-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./e2e/stalwart
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
